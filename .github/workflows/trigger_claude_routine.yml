name: 触发 Claude Routine

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 触发 Claude Routine
        env:
          ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ROUTINE_TOKEN}" ]; then
            echo "::error title=缺少 repository secret::仓库未配置 CLAUDE_ROUTINE_TOKEN（Settings → Secrets and variables → Actions），请求会带着空 Bearer 发出去并 401。"
            exit 1
          fi
          body=$(mktemp)
          code=$(curl -sS --max-time 60 -o "$body" -w '%{http_code}' \
            -X POST "https://api.anthropic.com/v1/claude_code/routines/trig_01QqQ9rpKCEVLB5R78v83umP/fire" \
            -H "Authorization: Bearer ${ROUTINE_TOKEN}" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json")
          echo "HTTP ${code}"
          cat "$body"; echo
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "::error title=Claude Routine 触发失败::HTTP ${code}"
            exit 1
          fi
          echo "✅ 已触发 Claude Routine（HTTP ${code}）" >> "$GITHUB_STEP_SUMMARY"
